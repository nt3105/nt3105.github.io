<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ngân Tú Dev — menu source</title>
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #070b14; }
.ntjr {
  position: fixed;
  top: 76px;
  right: 16px;
  z-index: 90;
  display: flex;
  flex-direction: column;
  width: min(360px, calc(100vw - 24px));
  max-height: 75vh;
  padding: 0 0 8px;
  overflow: hidden;
  border-radius: 28px;
  border: 1px solid rgba(255, 255, 255, .12);
  background: rgba(28, 28, 30, .92);
  color: #f2f2f7;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
  backdrop-filter: blur(28px) saturate(1.4);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.ntjr[hidden] { display: none; }
.ntjr-head {
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  align-items: center;
  gap: 10px;
  padding: 14px 14px 8px;
  cursor: grab;
  user-select: none;
  touch-action: none;
}
.ntjr-head b { display: block; letter-spacing: -.03em; font-size: 1.15rem; font-weight: 700; }
.ntjr-head small { color: rgba(235, 235, 245, .55); letter-spacing: 0; font-size: .72rem; }
.ntjr-chip {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(180deg, #64d2ff, #0a84ff);
  color: white;
  font-weight: 700;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.45);
}
.ntjr-online {
  color: rgba(235, 235, 245, .6);
  font-size: .68rem;
  letter-spacing: .04em;
  white-space: nowrap;
}
#ntjr-close {
  width: 30px;
  min-height: 30px;
  padding: 0;
  border-radius: 50%;
  border: 0;
  background: rgba(120, 120, 128, .32);
  color: rgba(235, 235, 245, .8);
  font-size: 1.05rem;
}
.ntjr-presets {
  display: flex;
  gap: 6px;
  margin: 4px 12px 8px;
  padding: 3px;
  overflow: auto;
  border-radius: 12px;
  background: rgba(118, 118, 128, .24);
}
.ntjr-presets button {
  flex: 1 0 auto;
  min-height: 30px;
  padding: 0 10px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: #f2f2f7;
  font-size: .68rem;
  font-weight: 600;
  letter-spacing: .01em;
}
.ntjr-presets button.is-on {
  color: #fff;
  background: #0a84ff;
}
.ntjr-scroll { overflow: auto; padding: 0 0 6px; }
.ntjr-group {
  margin: 14px 22px 6px;
  font-size: .72rem;
  font-weight: 600;
  letter-spacing: .01em;
  text-transform: none;
  color: rgba(235, 235, 245, .5);
}
.ntjr-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  min-height: 44px;
  margin: 0 12px;
  padding: 0 14px;
  background: rgba(58, 58, 60, .72);
  font-size: 15px;
  font-weight: 500;
  white-space: nowrap;
  border-bottom: .5px solid rgba(84, 84, 88, .7);
}
.ntjr-group + .ntjr-row { border-radius: 14px 14px 0 0; }
.ntjr-row:has(+ .ntjr-group),
.ntjr-row:last-child {
  border-bottom: 0;
  border-radius: 0 0 14px 14px;
}
.ntjr-group + .ntjr-row:has(+ .ntjr-group),
.ntjr-group + .ntjr-row:last-child { border-radius: 14px; }
.ntjr-row span { overflow: hidden; text-overflow: ellipsis; }
.ntjr-row b { color: #0a84ff; font-weight: 600; }
.ntjr-row input[type="checkbox"] {
  appearance: none;
  width: 51px;
  height: 31px;
  margin: 0;
  border: 0;
  border-radius: 99px;
  background: rgba(120, 120, 128, .36);
  position: relative;
  cursor: pointer;
  transition: background .2s ease;
}
.ntjr-row input[type="checkbox"]::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 27px;
  height: 27px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.28);
  transition: transform .22s cubic-bezier(.2, .9, .3, 1.15);
}
.ntjr-row input[type="checkbox"]:checked { background: #34c759; }
.ntjr-row input[type="checkbox"]:checked::after { transform: translateX(20px); }
.ntjr-row input[type="range"] { width: 118px; accent-color: #0a84ff; }
.ntjr-row select {
  min-height: 30px;
  border: 0;
  border-radius: 8px;
  background: rgba(118, 118, 128, .28);
  color: #0a84ff;
  font-weight: 600;
  padding: 0 8px;
}
.ntjr-foot {
  margin: 8px 22px 4px;
  padding: 0;
  border: 0;
  color: rgba(235, 235, 245, .45);
  font-size: .72rem;
  letter-spacing: 0;
  text-transform: none;
}

.ntjr { position: relative; top: auto; right: auto; }
</style>
</head>
<body>
<aside class="ntjr" id="ntjr">
  <div class="ntjr-head">
    <span class="ntjr-chip">NT</span>
    <div><b>Ngân Tú Dev</b><small>Menu trò chơi</small></div>
    <span class="ntjr-online">iOS</span>
    <button type="button" id="ntjr-close" aria-label="Đóng menu">×</button>
  </div>
  <div class="ntjr-presets">
    <button type="button" class="is-on">Thường</button>
    <button type="button">Tự cày</button>
    <button type="button">Chạy nhanh</button>
    <button type="button">Bất tử</button>
    <button type="button">Hỗn loạn</button>
  </div>
  <div class="ntjr-scroll">
    <p class="ntjr-group">Tự động</p>
    <label class="ntjr-row"><span>Tự chơi</span><input type="checkbox"></label>
    <label class="ntjr-row"><span>Xem đường</span><input type="checkbox"></label>
    <p class="ntjr-group">Người chơi</p>
    <label class="ntjr-row"><span>Tốc độ <b>1x</b></span><input type="range" min="0" max="4" step="1" value="1"></label>
    <label class="ntjr-row"><span>Xuyên tường</span><input type="checkbox"></label>
    <label class="ntjr-row"><span>Xuyên thân</span><input type="checkbox"></label>
    <label class="ntjr-row"><span>Chuyển động chậm</span><input type="checkbox"></label>
    <label class="ntjr-row"><span>Bất tử</span><input type="checkbox"></label>
    <p class="ntjr-group">Mồi</p>
    <label class="ntjr-row"><span>Định vị mồi</span><input type="checkbox"></label>
    <label class="ntjr-row"><span>Hút mồi</span><input type="checkbox"></label>
    <p class="ntjr-group">Điểm</p>
    <label class="ntjr-row"><span>Nhân điểm</span><select><option>x1</option><option>x2</option><option>x5</option></select></label>
    <p class="ntjr-group">Vui</p>
    <label class="ntjr-row"><span>Hỗn loạn</span><input type="checkbox"></label>
    <p class="ntjr-group">Dev</p>
    <label class="ntjr-row"><span>Vùng va chạm</span><input type="checkbox"></label>
  </div>
  <div class="ntjr-foot">Sẵn sàng</div>
</aside>
</body>
</html>
