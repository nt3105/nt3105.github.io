<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ngân Tú — Bảo trì</title>
  <meta name="description" content="Bảo trì. Đang nâng cấp web. Coming soon. Liên hệ Telegram @neverdierrr.">
  <meta name="theme-color" content="#080b14">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Ngân Tú — Bảo trì">
  <meta property="og:description" content="Bảo trì. Đang nâng cấp web. Coming soon. Liên hệ Telegram @neverdierrr.">
  <meta property="og:url" content="https://nt3105.github.io/">
  <meta property="og:image" content="https://nt3105.github.io/images/social-preview.png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --ink: #080b14; --fg: #f3f5fb; --muted: #9aa3b8; --cyan: #78e6ee; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--fg); }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      width: 34rem;
      height: 34rem;
      top: -12rem;
      right: -8rem;
      background: radial-gradient(circle, rgba(120, 230, 238, .16), transparent 68%);
      pointer-events: none;
    }
    main { position: relative; width: min(36rem, 100%); }
    .brand { display: flex; align-items: center; gap: .75rem; margin: 0; color: var(--muted); font-size: .8rem; letter-spacing: .18em; text-transform: uppercase; }
    .mark { color: var(--cyan); font-family: ui-monospace, monospace; letter-spacing: 0; text-transform: none; }
    .mark::before { content: "</>"; }
    h1 { margin: 1.4rem 0 0; font-size: clamp(4rem, 14vw, 7rem); font-weight: 500; letter-spacing: -.05em; line-height: .9; }
    .up { margin: 1rem 0 0; color: var(--muted); font-size: clamp(1.45rem, 4vw, 2rem); line-height: 1.3; }
    .soon {
      display: inline-flex;
      align-items: center;
      gap: .7rem;
      margin: 2rem 0 0;
      padding: .7rem 1rem .7rem .85rem;
      border: 1px solid rgba(120, 230, 238, .4);
      border-radius: 999px;
      color: var(--cyan);
      font-size: .8rem;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .dot { width: .45rem; height: .45rem; border-radius: 999px; background: var(--cyan); box-shadow: 0 0 0 .28rem rgba(120, 230, 238, .16); }
    .tg {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      margin: .85rem 0 0;
      padding: .72rem 1.05rem .72rem .85rem;
      border: 1px solid rgba(243, 245, 251, .14);
      border-radius: 999px;
      background: rgba(243, 245, 251, .03);
      color: var(--fg);
      text-decoration: none;
      font-size: .9rem;
      font-weight: 500;
    }
    .tg svg { color: var(--cyan); flex: none; }
    .tg em {
      color: var(--muted);
      font-style: normal;
      font-weight: 400;
    }
    .tg:hover { border-color: rgba(120, 230, 238, .5); }
    .tg:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
    @media (prefers-reduced-motion: no-preference) {
      .dot { animation: pulse 2.4s ease-in-out infinite; }
    }
    @keyframes pulse { 50% { opacity: .35; } }
  </style>
</head>
<body>
  <main>
    <p class="brand"><span class="mark" aria-hidden="true"></span> Ngân Tú</p>
    <h1>Bảo trì</h1>
    <p class="up">Đang nâng cấp web.</p>
    <p class="soon"><span class="dot" aria-hidden="true"></span>Coming soon</p>
    <a class="tg" href="https://t.me/neverdierrr" target="_blank" rel="noopener noreferrer">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M21.6 4.2 2.9 11.3c-.9.4-.9.8-.2 1l4.8 1.5 1.9 5.8c.2.7.1 1 .7.9.4 0 .6-.2.9-.4l2.7-2.6 5.3 3.9c.7.4 1.2.2 1.4-.7l2.6-12.2c.3-1.1-.4-1.6-1.4-1.3Zm-3.1 3.3-8.1 7.4-.3 3.3-1.5-4.6 9.9-6.1Z"/>
      </svg>
      Liên hệ Telegram <em>@neverdierrr</em>
    </a>
  </main>
</body>
</html>
