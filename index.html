<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ngân Tú — Bảo trì</title>
  <meta name="description" content="Bảo trì. Đang nâng cấp web. Coming soon.">
  <meta name="theme-color" content="#080b14">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Ngân Tú — Bảo trì">
  <meta property="og:description" content="Bảo trì. Đang nâng cấp web. Coming soon.">
  <meta property="og:url" content="https://nt3105.github.io/">
  <meta property="og:image" content="https://nt3105.github.io/images/social-preview.png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --ink: #080b14; --fg: #f3f5fb; --muted: #9aa3b8; --cyan: #78e6ee; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--fg); }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      width: 34rem;
      height: 34rem;
      top: -12rem;
      right: -8rem;
      background: radial-gradient(circle, rgba(120, 230, 238, .16), transparent 68%);
      pointer-events: none;
    }
    main { position: relative; width: min(36rem, 100%); }
    .brand { display: flex; align-items: center; gap: .75rem; margin: 0; color: var(--muted); font-size: .8rem; letter-spacing: .18em; text-transform: uppercase; }
    .mark { color: var(--cyan); font-family: ui-monospace, monospace; letter-spacing: 0; text-transform: none; }
    .mark::before { content: "</>"; }
    .clock {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: .55rem;
      margin: 2.2rem 0 0;
      font-variant-numeric: tabular-nums;
    }
    .date {
      margin: 0;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 500;
      letter-spacing: .22em;
    }
    .time {
      margin: 0;
      font-size: clamp(2.6rem, 9vw, 4.2rem);
      font-weight: 500;
      letter-spacing: -.04em;
      line-height: .9;
    }
    .sec { color: var(--cyan); }
    h1 { margin: 1.8rem 0 0; font-size: clamp(4rem, 14vw, 7rem); font-weight: 500; letter-spacing: -.05em; line-height: .9; }
    .up { margin: 1rem 0 0; color: var(--muted); font-size: clamp(1.45rem, 4vw, 2rem); line-height: 1.3; }
    .soon {
      display: inline-flex;
      align-items: center;
      gap: .7rem;
      margin: 2rem 0 0;
      padding: .7rem 1rem .7rem .85rem;
      border: 1px solid rgba(120, 230, 238, .4);
      border-radius: 999px;
      color: var(--cyan);
      font-size: .8rem;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .dot { width: .45rem; height: .45rem; border-radius: 999px; background: var(--cyan); box-shadow: 0 0 0 .28rem rgba(120, 230, 238, .16); }
    @media (prefers-reduced-motion: no-preference) {
      .dot { animation: pulse 2.4s ease-in-out infinite; }
    }
    @keyframes pulse { 50% { opacity: .35; } }
  </style>
</head>
<body>
  <main>
    <p class="brand"><span class="mark" aria-hidden="true"></span> Ngân Tú</p>
    <time class="clock" id="clock" datetime="">
      <span class="date" id="clock-date">--.--.----</span>
      <span class="time"><span id="clock-hm">--:--</span><span class="sec" id="clock-sec">:--</span></span>
    </time>
    <h1>Bảo trì</h1>
    <p class="up">Đang nâng cấp web.</p>
    <p class="soon"><span class="dot" aria-hidden="true"></span>Coming soon</p>
  </main>
  <script>
    (function () {
      var dateNode = document.getElementById("clock-date");
      var hmNode = document.getElementById("clock-hm");
      var secNode = document.getElementById("clock-sec");
      var clock = document.getElementById("clock");
      function pad(value) { return (value < 10 ? "0" : "") + value; }
      function render() {
        var now = new Date();
        dateNode.textContent = pad(now.getDate()) + "." + pad(now.getMonth() + 1) + "." + now.getFullYear();
        hmNode.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
        secNode.textContent = ":" + pad(now.getSeconds());
        clock.dateTime = now.toISOString();
      }
      function tick() {
        render();
        setTimeout(tick, 1000 - (Date.now() % 1000) + 20);
      }
      render();
      setTimeout(tick, 1000 - (Date.now() % 1000) + 20);
    })();
  </script>
</body>
</html>
