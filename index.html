<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#080b14">
  <meta name="description" content="Website NTJR đang tạm thời bảo trì.">
  <title>Đang bảo trì | NTJR</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center;
      padding: 24px; background: #080b14; color: #f5f6fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    main { width: min(100%, 520px); text-align: center; }
    .brand { margin: 0 0 28px; color: #a9a7bf; font-size: .8rem; font-weight: 700; letter-spacing: .35em; }
    h1 { margin: 0 0 16px; font-size: clamp(2rem, 6vw, 3rem); font-weight: 700; line-height: 1.18; letter-spacing: -.04em; }
    p { margin: 0; color: #a9aec2; font-size: 1rem; line-height: 1.8; }
    .line { height: 2px; width: 44px; margin: 0 auto 28px; background: #8d80f5; border-radius: 999px; }
  </style>
</head>
<body>
  <main aria-labelledby="maintenance-title">
    <div class="brand">NTJR</div>
    <div class="line" aria-hidden="true"></div>
    <h1 id="maintenance-title">Website đang bảo trì</h1>
    <p>Trang web hiện tạm thời đóng để bảo trì.<br>Vui lòng quay lại sau. Cảm ơn bạn!</p>
  </main>
</body>
</html>
