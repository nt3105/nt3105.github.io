<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ngân Tú — Đang bảo trì</title>
  <meta name="description" content="Web đang bảo trì và nâng cấp. Mở lại khi Ngân Tú có sự.">
  <meta name="theme-color" content="#080b14">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Ngân Tú — Đang bảo trì">
  <meta property="og:description" content="Web đang bảo trì và nâng cấp. Mở lại khi mình có sự.">
  <meta property="og:url" content="https://nt3105.github.io/">
  <meta property="og:image" content="https://nt3105.github.io/images/social-preview.png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --ink: #080b14; --fg: #f3f5fb; --muted: #9aa3b8; --cyan: #78e6ee; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--fg); }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      width: 34rem;
      height: 34rem;
      top: -12rem;
      right: -8rem;
      background: radial-gradient(circle, rgba(120, 230, 238, .16), transparent 68%);
      pointer-events: none;
    }
    main { width: min(36rem, 100%); }
    .mark { margin: 0; font-family: ui-monospace, monospace; color: var(--cyan); font-size: .95rem; }
    .mark::before { content: "</>"; }
    .who { margin: 1.5rem 0 0; color: var(--muted); font-size: .8rem; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 1rem 0 0; font-size: clamp(3.4rem, 12vw, 6rem); font-weight: 500; letter-spacing: -.045em; line-height: .92; }
    h1 span { color: var(--cyan); }
    .rule { width: 3rem; height: 1px; margin: 1.6rem 0 0; background: var(--cyan); }
    .up { margin: 1.5rem 0 0; color: var(--muted); font-size: clamp(1.45rem, 4vw, 2rem); line-height: 1.3; }
    .when { margin: 2rem 0 0; font-size: 1.125rem; }
  </style>
</head>
<body>
  <main>
    <p class="mark" aria-hidden="true"></p>
    <p class="who">Ngân Tú</p>
    <h1>Đang bảo trì<span>.</span></h1>
    <div class="rule"></div>
    <p class="up">Đang nâng cấp web.</p>
    <p class="when">Mở lại khi mình có sự.</p>
  </main>
</body>
</html>
