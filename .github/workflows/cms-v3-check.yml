name: V3 CMS JavaScript syntax
on:
  pull_request:
  push:
    branches: [feature/admin-v3-cms-preview]
jobs:
  js-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check CMS JavaScript syntax
        run: |
          node --check script.js
          node --check cms-public-v3.js
          node tests/cms-v3-smoke.cjs
