    // Embedded studio follows the parent page's appearance without changing its standalone design.
    if (new URLSearchParams(location.search).has('embed')) {
      const root = document.documentElement;
      root.classList.add('embed');
      if (window.parent !== window) {
        try {
          const parentRoot = window.parent.document.documentElement;
          const syncAppearance = () => {
            root.dataset.appearance = parentRoot.dataset.appearance === 'light' ? 'light' : 'dark';
          };
          syncAppearance();
          new MutationObserver(syncAppearance).observe(parentRoot, {
            attributes: true, attributeFilter: ['data-appearance']
          });
        } catch (_) { root.dataset.appearance = 'dark'; }
      }
    }

<body>
  <div class="aura one" aria-hidden="true"></div><div class="aura two" aria-hidden="true"></div>

      <div class="tabrow"><div class="tab"><span class="py-badge">◆</span><span id="fileName">hello.py</span><span style="color:#697f9e">×</span></div><div class="tab-meta">UTF-8 · PYTHON 3</div></div>
      <div class="editor" id="editor" aria-label="Mã Python đang được gõ"><div class="code-lines" id="codeLines"><div class="code-line"><span class="line-num">1</span><span class="code-text"><span class="caret"></span></span></div></div></div>

  </main>
  <script>
  (() => {
    'use strict';
    // Kịch bản dựng sẵn: đổi 3 mục này để thay nội dung, không cần máy chủ hoặc Python.
    const scenes = [
      {file:'hello.py',title:'Hello World',code:'print("Hello World!")',events:[{line:1,text:'Hello World!\n'}]},
      {file:'intro.py',title:'Giới thiệu',code:'print("Xin chào, mình là Ngân Tú!")',events:[{line:1,text:'Xin chào, mình là Ngân Tú!\n'}]},
      {file:'calculator.py',title:'Vòng lặp và phép tính',code:[
        'print("Bắt đầu chương trình...")',
        'print("Đếm từ 1 đến 10")',
        'chan = []',
        'le = []',
        'tong = 0',
        'for i in range(1, 11):',
        '    tong += i',
        '    if i % 2 == 0:',
        '        chan.append(i)',
        '    else:',
        '        le.append(i)',
        'print("Số chẵn:", *chan)',
        'print("Số lẻ:", *le)',
        'print("Tổng =", tong)',
        'print("Hoàn thành!")'
      ].join('\n'),events:[
        {line:1,text:'Bắt đầu chương trình...\n'},
        {line:2,text:'Đếm từ 1 đến 10\n'},
        {line:6,walk:[6,7,8,9,6,7,8,10,11,6,7,8,9,6,7,8,10,11],delay:65},
        {line:12,text:'Số chẵn: 2 4 6 8 10\n'},
        {line:13,text:'Số lẻ: 1 3 5 7 9\n'},
        {line:14,text:'Tổng = 55\n'},
        {line:15,text:'Hoàn thành!\n'}
      ]}
    ];
    const $=id=>document.getElementById(id);
    const editor=$('editor'), codeLines=$('codeLines'), output=$('output'), outputWrap=$('outputWrap'), outputCaret=$('outputCaret');
    // This is a real text node BEFORE a real inline cursor node, both inside <pre>.
    // It follows every character, wrapped line and newline without position calculations.
    const outputText=document.createTextNode('');
    output.insertBefore(outputText,outputCaret);
    let runToken=0,paused=false,soundEnabled=false,audioContext=null,keystroke=0;
    const typeDelay=60, eraseDelay=16, eraseChunk=8, outDelay=55, holdDelay=3000;
    const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function syntax(raw){
      let html='',prev=0;
      const regex=/(#[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b\d+(?:\.\d+)?\b|\b[A-Za-z_]\w*\b)/g;
      for(const match of raw.matchAll(regex)){
        html+=escapeHtml(raw.slice(prev,match.index));const s=match[0];let cls='var';
        if(s[0]==='#')cls='comment';else if(s[0]==='"'||s[0]==="'")cls='str';else if(/^\d/.test(s))cls='num';
        else if(['print','range','append','len','sum','int','str'].includes(s))cls='fn';
        else if(['for','in','if','else','while','def','return'].includes(s))cls='kw';
        html+='<span class="'+cls+'">'+escapeHtml(s)+'</span>';prev=match.index+s.length;
      }
      return html+escapeHtml(raw.slice(prev));
    }
    let codeCursor;
    function renderCode(text,showCaret=true,activeLine=0){
      const lines=text.split('\n');const fragment=document.createDocumentFragment();
      lines.forEach((line,i)=>{
        const row=document.createElement('div');row.className='code-line'+(activeLine===i+1?' active':'');
        const number=document.createElement('span');number.className='line-num';number.textContent=i+1;
        const body=document.createElement('span');body.className='code-text';body.innerHTML=syntax(line);
        if(showCaret&&i===lines.length-1){const cur=document.createElement('span');cur.className='caret';cur.setAttribute('aria-hidden','true');body.appendChild(cur);codeCursor=cur;}
        row.append(number,body);fragment.append(row);
      });
      codeLines.replaceChildren(fragment);
      $('positionText').textContent=`Ln ${lines.length}, Col ${Array.from(lines.at(-1)).length+1}`;
      if(activeLine){
        const active=codeLines.children[activeLine-1];
        if(active){
          // scrollIntoView() also scrolls ancestor documents, including the parent page
          // when the studio is embedded in an iframe. Keep the animation inside editor.
          const row=active.getBoundingClientRect(), box=editor.getBoundingClientRect();
          if(row.bottom>box.bottom-16)editor.scrollTop+=row.bottom-box.bottom+16;
          else if(row.top<box.top+16)editor.scrollTop+=row.top-box.top-16;
        }
      }
      else if(showCaret&&codeCursor){const offset=codeCursor.getBoundingClientRect().bottom-editor.getBoundingClientRect().bottom;if(offset>0)editor.scrollTop+=offset+32;}
    }
    function setStatus(name){
      const messages={Writing:'● Writing',Running:'▶ Running',Finished:'✓ Finished',Clearing:'⌫ Clearing',Paused:'Ⅱ Paused'};
      $('statusText').textContent=messages[name]||name;
      $('runStatus').textContent=name==='Running'?'● Executing…':name==='Writing'?'Typing source…':name==='Clearing'?'Cleaning up…':name==='Finished'?'Process finished · exit code 0':name==='Paused'?'Paused':name;
    }
    function setProgress(v){const n=Math.max(0,Math.min(100,Math.round(v)));$('fill').style.width=n+'%';$('percent').textContent=n+'%';$('track').setAttribute('aria-valuenow',String(n));}
    function updateOutput(v,visible){outputText.nodeValue=v;outputCaret.hidden=!visible;outputWrap.scrollTop=outputWrap.scrollHeight;}
    function setPaused(v){paused=v;const label=paused?'Tiếp tục':'Tạm dừng';$('pause').setAttribute('aria-label',label);$('pauseIcon').textContent=paused?'▶':'⏸';$('pauseText').textContent=label;$('live').textContent=paused?'PAUSED':'AUTO PLAY · ON';if(paused)setStatus('Paused');}
    function clickSound(){
      if(!soundEnabled||!audioContext||audioContext.state!=='running')return;
      if(++keystroke%3!==0)return;
      try{const time=audioContext.currentTime;const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='triangle';osc.frequency.setValueAtTime(420+(keystroke%7)*33,time);osc.frequency.exponentialRampToValueAtTime(170,time+.026);gain.gain.setValueAtTime(.006,time);gain.gain.exponentialRampToValueAtTime(.0001,time+.032);osc.connect(gain);gain.connect(audioContext.destination);osc.start(time);osc.stop(time+.04);}catch(_){/* no audio */}
    }
    async function delay(ms,token){
      let remaining=ms;
      while(remaining>0){if(token!==runToken)return false;if(paused){await new Promise(r=>setTimeout(r,35));continue;}
        const part=Math.min(25,remaining);await new Promise(r=>setTimeout(r,part));remaining-=part;}
      return token===runToken;
    }
    async function typeCode(s,token,index){let shown='';const chars=Array.from(s.code);editor.scrollTop=0;setStatus('Writing');
      for(let i=0;i<chars.length;i++){if(token!==runToken)return false;shown+=chars[i];renderCode(shown,true);clickSound();setProgress(((index+(i+1)/chars.length*.58)/scenes.length)*100);
        if(!(await delay(chars[i]==='\n'?92:typeDelay,token)))return false;}
      return true;
    }
    async function printText(str,token){let text=outputText.nodeValue;
      for(const c of Array.from(str)){if(token!==runToken)return false;text+=c;updateOutput(text,true);clickSound();if(!(await delay(c==='\n'?90:outDelay,token)))return false;}
      return true;
    }
    async function execute(s,token,index){setStatus('Running');const events=s.events;
      for(let n=0;n<events.length;n++){if(token!==runToken)return false;const ev=events[n];
        if(ev.walk){for(const line of ev.walk){renderCode(s.code,false,line);if(!(await delay(ev.delay||90,token)))return false;}}
        renderCode(s.code,false,ev.line);
        if(!(await delay(220,token)))return false;
        if(ev.text&&!(await printText(ev.text,token)))return false;
        setProgress(((index+.58+(n+1)/events.length*.27)/scenes.length)*100);
      }
      renderCode(s.code,false);setStatus('Finished');updateOutput(outputText.nodeValue,true);setProgress(((index+.85)/scenes.length)*100);return true;
    }
    async function clearScene(s,token,index){
      setStatus('Clearing');
      // Xóa rất nhanh theo nhóm 8 ký tự mỗi khung ~16ms, thay vì 30ms MỖI ký tự.
      // Con trỏ vẫn nằm ngay sau chữ cuối cùng trong Output và Code khi lùi.
      const outputChars=Array.from(outputText.nodeValue);
      while(outputChars.length){
        if(token!==runToken)return false;
        outputChars.length=Math.max(0,outputChars.length-eraseChunk);
        updateOutput(outputChars.join(''),true);
        if(!(await delay(eraseDelay,token)))return false;
      }
      updateOutput('',false);
      const codeChars=Array.from(s.code);
      while(codeChars.length){
        if(token!==runToken)return false;
        codeChars.length=Math.max(0,codeChars.length-eraseChunk);
        renderCode(codeChars.join(''),true);
        if(!(await delay(eraseDelay,token)))return false;
      }
      renderCode('',true);
      setProgress(((index+1)/scenes.length)*100);
      return true;
    }
    async function start(){const token=++runToken;setPaused(false);setProgress(0);outputText.nodeValue='';editor.scrollTop=0;updateOutput('',false);renderCode('',true);
      while(token===runToken){for(let i=0;i<scenes.length;i++){if(token!==runToken)return;
        const s=scenes[i];$('sceneTitle').textContent=String(i+1).padStart(2,'0')+'.';$('description').textContent=s.title;$('sceneCounter').textContent=String(i+1).padStart(2,'0')+' / 03';$('fileName').textContent=s.file;
        renderCode('',true);updateOutput('',false);editor.scrollTop=0;outputWrap.scrollTop=0;
        if(!(await delay(350,token)))return;
        if(!(await typeCode(s,token,i)))return;
        if(!(await delay(1000,token)))return;
        if(!(await execute(s,token,i)))return;
        if(!(await delay(holdDelay,token)))return;
        if(!(await clearScene(s,token,i)))return;
        if(!(await delay(200,token)))return;
      }
      if(token!==runToken)return;setProgress(0);
      }
    }
    $('pause').addEventListener('click',()=>{setPaused(!paused);if(!paused)setStatus(outputText.nodeValue?'Running':'Writing');});
    $('restart').addEventListener('click',()=>{start();});
    $('sound').addEventListener('click',async()=>{
      if(!soundEnabled){try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx){$('soundText').textContent='Không hỗ trợ';return;}audioContext=audioContext||new Ctx();await audioContext.resume();soundEnabled=true;}catch(_){$('soundText').textContent='Không hỗ trợ';return;}}
      else soundEnabled=false;
      $('sound').setAttribute('aria-pressed',String(soundEnabled));$('sound').setAttribute('aria-label',soundEnabled?'Tắt âm thanh':'Bật âm thanh');$('soundIcon').textContent=soundEnabled?'♫':'♪̸';$('soundText').textContent=soundEnabled?'Đang bật tiếng':'Âm thanh';
    });
    $('fullscreen').addEventListener('click',()=>{if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});}else{($('window').requestFullscreen?$('window'):document.documentElement).requestFullscreen().catch(()=>{});}});
    const defaultScenes = scenes.map(s=>({...s,events:s.events.map(e=>({...e}))}));
    let lastCMSConfig = '';
    window.addEventListener('message', event => {
      if(event.source !== window.parent || event.origin !== window.location.origin || event.data?.type !== 'ntjr:python-studio-config') return;
      const fields=event.data.code;
      if(!fields || typeof fields !== 'object') return;
      const mapping=[['pythonHello','pythonHelloOutput'],['pythonIntro','pythonIntroOutput'],['pythonCalculator','pythonCalculatorOutput']];
      const values=mapping.map(([codeKey,outKey])=>[fields[codeKey],fields[outKey]].map(v=>typeof v==='string'?v:''));
      const fingerprint=JSON.stringify(values);
      if(fingerprint===lastCMSConfig) return;
      lastCMSConfig=fingerprint;
      mapping.forEach(([codeKey,outKey],i)=>{
        const base=defaultScenes[i], scene=scenes[i];
        scene.code=base.code;
        scene.events=base.events.map(e=>({...e}));
        const source=fields[codeKey], result=fields[outKey];
        if(typeof source==='string' && source.trim() && source.length<=5000) scene.code=source.replace(/\r\n?/g,'\n');
        if(typeof result==='string' && result.trim() && result.length<=2000){
          const rendered=result.replace(/\r\n?/g,'\n');
          scene.events=[{line:Math.max(1,scene.code.split('\n').length),text:rendered.endsWith('\n')?rendered:rendered+'\n'}];
        }
      });
      start();
    });

    // The outer page owns scrolling; keep this embedded panel exactly as tall as its content.
    if (document.documentElement.classList.contains('embed') && window.parent !== window) {
      const panel = document.querySelector('.studio');
      const notifyParentSize = () => {
        if (!panel) return;
        window.parent.postMessage({
          type: 'ntjr:python-studio-height',
          height: Math.ceil(panel.getBoundingClientRect().height)
        }, window.location.origin);
      };
      if (panel && typeof ResizeObserver === 'function') new ResizeObserver(notifyParentSize).observe(panel);
      window.addEventListener('resize', notifyParentSize, {passive:true});
      requestAnimationFrame(notifyParentSize);
    }
    // Let the visitor scroll the main website while their pointer is over the embedded code.
    if (document.documentElement.classList.contains('embed') && window.parent !== window) {
      const moveHost = (x,y) => {
        try { window.parent.scrollBy({left:x,top:y,behavior:'instant'}); } catch (_) {}
      };
      window.addEventListener('wheel', event => {
        if(event.ctrlKey || event.metaKey || !(event.deltaX || event.deltaY)) return;
        const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerHeight : 1;
        event.preventDefault();
        moveHost(event.deltaX * unit,event.deltaY * unit);
      },{passive:false});
      let lastTouch=null;
      window.addEventListener('touchstart',event=>{
        lastTouch=event.touches.length===1
          ? {x:event.touches[0].clientX,y:event.touches[0].clientY}:null;
      },{passive:true});
      window.addEventListener('touchmove',event=>{
        if(!lastTouch || event.touches.length!==1)return;
        const t=event.touches[0],dx=lastTouch.x-t.clientX,dy=lastTouch.y-t.clientY;
        lastTouch={x:t.clientX,y:t.clientY};
        if(!event.cancelable || Math.abs(dy)<0.1)return;
        event.preventDefault();
        moveHost(dx,dy);
      },{passive:false});
      window.addEventListener('touchend',()=>lastTouch=null,{passive:true});
      window.addEventListener('touchcancel',()=>lastTouch=null,{passive:true});
    }
    // Start after parsing, without any click; custom animation is all client-side.
    start();
  })();
  </script>
